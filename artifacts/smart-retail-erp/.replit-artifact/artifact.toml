kind = "web"
previewPath = "/"
title = "Smart Retail ERP"
version = "1.0.0"
id = "artifacts/smart-retail-erp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24215

[services.development]
run = "pnpm --filter @workspace/smart-retail-erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-retail-erp", "run", "build" ]
publicDir = "artifacts/smart-retail-erp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24215"
BASE_PATH = "/"
